app = 'dog-sitter-marketplace'
primary_region = 'lax'

[build]

[processes]
  app = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  worker = "uv run python worker.py"

[deploy]
  release_command = "sh migrate.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
  processes = ['worker']