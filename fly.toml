app = 'dog-sitter-marketplace'
primary_region = 'lax'

[build]

[deploy]
  release_command = "sh migrate.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
